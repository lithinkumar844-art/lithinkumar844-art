name: Build Profile Animation
# Generates the moving image from assets/profile.jpg

on:
  push:
    paths:
      - ".github/workflows/profile-animation.yml"
      - "assets/profile.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  animate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create animated profile GIF
        run: |
          python -m pip install --quiet pillow
          mkdir -p assets
          cp assets/profile.jpg /tmp/profile.jpg
          python - <<'PY'
          from PIL import Image, ImageEnhance
          import math

          src = Image.open("/tmp/profile.jpg").convert("RGB")
          size = 360
          src.thumbnail((size, size), Image.Resampling.LANCZOS)
          canvas = Image.new("RGB", (size, size), "white")
          x = (size - src.width) // 2
          y = (size - src.height) // 2
          canvas.paste(src, (x, y))

          frames = []
          for i in range(16):
              t = i / 15
              s = 1.0 + 0.018 * math.sin(2 * math.pi * t)
              w = int(size * s)
              h = int(size * s)
              frame = canvas.resize((w, h), Image.Resampling.LANCZOS)
              left = (w - size) // 2
              top = (h - size) // 2
              frame = frame.crop((left, top, left + size, top + size))
              frames.append(frame)

          frames[0].save(
              "assets/profile-moving.gif",
              save_all=True,
              append_images=frames[1:],
              duration=90,
              loop=0,
              optimize=True,
          )
          PY

      - name: Commit animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-moving.gif
          git diff --cached --quiet || git commit -m "Add animated profile photo"
          git push
