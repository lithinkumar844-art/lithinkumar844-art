name: Build Profile Motion Graphics

on:
  push:
    paths:
      - ".github/workflows/profile-animation.yml"
      - "assets/profile-anime.gif"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  animate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create motion graphics background + anime profile
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import math, random

          src = Image.open("assets/profile-anime.gif")
          frames = []
          for i in range(getattr(src, "n_frames", 1)):
              src.seek(i)
              fr = src.convert("RGBA")
              # Fit anime image inside a circular glass-style foreground area
              fr.thumbnail((300, 300), Image.Resampling.LANCZOS)
              frames.append(fr.copy())

          W = H = 640
          out = []
          random.seed(42)
          nodes = [(random.randint(40, W-40), random.randint(40, H-40)) for _ in range(18)]

          total = max(len(frames), 24)
          for i in range(total):
              canvas = Image.new("RGBA", (W, H), (5, 5, 8, 255))
              bg = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              d = ImageDraw.Draw(bg)

              # Moving gold particles
              for j, (x, y) in enumerate(nodes):
                  yy = (y + i * (1.2 + (j % 3) * 0.35)) % H
                  xx = x + math.sin(i / 10 + j) * 12
                  r = 2 + (j % 3)
                  d.ellipse((xx-r, yy-r, xx+r, yy+r), fill=(225, 180, 70, 180))

              # Animated network lines
              for a in range(len(nodes)):
                  for b in range(a + 1, len(nodes)):
                      x1, y1 = nodes[a]
                      x2, y2 = nodes[b]
                      dist = math.hypot(x2-x1, y2-y1)
                      if dist < 190:
                          alpha = int(35 + 25 * (0.5 + 0.5 * math.sin(i/12 + a)))
                          d.line((x1, y1, x2, y2), fill=(210, 170, 70, alpha), width=1)

              # Soft moving glow
              gx = W/2 + math.sin(i/12) * 120
              gy = H/2 + math.cos(i/15) * 90
              glow = Image.new("RGBA", (W, H), (0,0,0,0))
              gd = ImageDraw.Draw(glow)
              gd.ellipse((gx-150, gy-150, gx+150, gy+150), fill=(190,140,45,45))
              glow = glow.filter(ImageFilter.GaussianBlur(45))
              canvas = Image.alpha_composite(canvas, glow)
              canvas = Image.alpha_composite(canvas, bg)

              # Central subtle gold ring
              ring = Image.new("RGBA", (W, H), (0,0,0,0))
              rd = ImageDraw.Draw(ring)
              pulse = int(148 + 8 * math.sin(i/8))
              rd.ellipse((W//2-pulse, H//2-pulse, W//2+pulse, H//2+pulse),
                         outline=(230,190,85,150), width=3)
              canvas = Image.alpha_composite(canvas, ring)

              # Anime character: subtle floating / swaying motion
              fr = frames[i % len(frames)].copy()
              angle = 2.2 * math.sin(2 * math.pi * i / total)
              scale = 1.0 + 0.025 * math.sin(2 * math.pi * i / total + 0.7)
              nw = max(1, int(fr.width * scale))
              nh = max(1, int(fr.height * scale))
              fr = fr.resize((nw, nh), Image.Resampling.LANCZOS)
              fr = fr.rotate(angle, resample=Image.Resampling.BICUBIC, expand=True)
              bob_x = int(10 * math.sin(2 * math.pi * i / total))
              bob_y = int(8 * math.sin(4 * math.pi * i / total))
              fw, fh = fr.size
              px = (W-fw)//2 + bob_x
              py = (H-fh)//2 + bob_y
              canvas.alpha_composite(fr, (px, py))
              out.append(canvas.convert("P", palette=Image.Palette.ADAPTIVE))

          out[0].save(
              "assets/profile-motion.gif",
              save_all=True,
              append_images=out[1:],
              duration=90,
              loop=0,
              optimize=True,
          )
          PY

      - name: Commit motion graphic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-motion.gif
          git diff --cached --quiet || git commit -m "Add animated motion graphics profile"
          git push
